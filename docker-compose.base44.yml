# Base44 dev environment — runs the app from cloned source with live reload.
# The app is a Next.js 16 + Prisma Next (Prisma 8) project using bun. It runs in
# demo mode without external credentials; Paystack/Football API keys are optional.
#
# Requires a bun release with `node:sqlite` (the driver behind the Prisma Next
# SQLite façade) — verified on bun 1.4.2. `oven/bun:1` tracks the latest 1.x.
services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      # keep container-installed node_modules isolated from the host bind mount
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      # lets next.config.ts derive the allowedDevOrigins preview host at runtime
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      # bind mounts often need polling for HMR to fire
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    # db:emit compiles src/prisma/contract.prisma → contract.json/contract.d.ts
    # (committed, so this is only needed after a contract change); db:seed is
    # idempotent. Prisma Next has no `db push`: schema changes go through
    # `prisma db update` (see README → Prisma Next).
    command: sh -c "bun install && bun run db:emit && bun run db:seed && bunx next dev --webpack -p 3000"
    restart: unless-stopped
